name: APK Derleme Otomasyonu (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repositori Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sistem Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev \
          python3-dev python3-pip git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake

    - name: Buildozer, Cython ve CFFI Yükle
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" cffi buildozer

    - name: APK Dosyasını Derle
      run: |
        buildozer -v android debug

    - name: Derlenen APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: AskUyumu-Debug-APK
        path: bin/*.apk
