name: APK Derleme Otomasyonu (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repositori Kodlarını Çek
      uses: actions/checkout@v4

    - name: Buildozer Docker ile APK Derle
      uses: docker://kivy/buildozer
      with:
        args: buildozer -v android debug

    - name: Derlenen APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: AskUyumu-Debug-APK
        path: bin/*.apk
