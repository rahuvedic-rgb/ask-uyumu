name: APK Derleme Otomasyonu (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repositori Kodlarını Çek
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Sistem Bağımlılıklarını Kur (Android SDK / NDK & Build Tools)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cffi libssl-dev libffi-dev \
          python3-dev python3-pip git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Buildozer ve Cython Yükle
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33

    - name: Android SDK / NDK Lisanslarını Onayla ve Hazırla
      run: |
        yes | buildozer android debug --just-init || true

    - name: APK Dosyasını Derle (Buildozer Debug)
      run: |
        buildozer -v android debug

    - name: Derlenen APK Dosyasını GitHub Artifacts Olarak Yükle
      uses: actions/upload-artifact@v3
      with:
        name: AskUyumu-Debug-APK
        path: bin/*.apk
