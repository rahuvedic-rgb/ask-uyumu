name: APK Derleme Otomasyonu (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repositori Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sistem Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev \
          python3-dev python3-pip git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake

    - name: Buildozer ve Cython Yükle
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" cffi
        pip install git+https://github.com/kivy/buildozer.git
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Hatalı Önbelleği Temizle ve APK Derle
      run: |
        buildozer android clean || true
        buildozer -v android debug

    - name: Derlenen APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: AskUyumu-Debug-APK
        path: bin/*.apk
